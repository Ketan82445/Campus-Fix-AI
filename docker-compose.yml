version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusfix_postgres
    restart: always
    environment:
      POSTGRES_DB: campusfix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: campusfix_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusfix_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/campusfix_db?schema=public
      - JWT_SECRET=campusfix_production_secret_key_2026
      - JWT_REFRESH_SECRET=campusfix_production_refresh_key_2026
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - postgres
      - ai-service

volumes:
  pgdata:
